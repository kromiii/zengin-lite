name: Update and Release

on:
  schedule:
    # Run at 00:00 UTC (09:00 JST) every day
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ssh-key: ${{ secrets.DEPLOY_KEY }} # Optional: Use if needing to push with SSH, otherwise GITHUB_TOKEN might suffice if permissions set correctly

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Configure Gem Credentials
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: |
          mkdir -p $HOME/.gem
          touch $HOME/.gem/credentials
          chmod 0600 $HOME/.gem/credentials
          printf -- "---\n:rubygems_api_key: ${GEM_HOST_API_KEY}\n" > $HOME/.gem/credentials

      - name: Run Update Script
        run: ruby scripts/update_and_release.rb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
